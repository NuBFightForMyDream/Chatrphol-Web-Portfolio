# ═══════════════════════════════════════════════════════════════════
#  📝 content.yml — ทุกข้อความบนเว็บอยู่ในไฟล์นี้ไฟล์เดียว
#
#  แก้ข้อความในไฟล์นี้ → กด Commit → รอ ~1 นาที → รีเฟรชเว็บ
#  ไม่ต้องแตะไฟล์อื่นเลย (index.html / assets/ เป็นโค้ด ไม่ต้องแก้)
#
#  กฎง่ายๆ 5 ข้อ
#   1) บรรทัด/ข้อความหลัง  #  คือคำอธิบาย เว็บจะไม่แสดง
#   2) อย่าลบชื่อหัวข้อและเครื่องหมาย :  (เช่น  name: )  แก้แค่ข้อความหลัง :
#   3) การเว้นวรรคหน้าบรรทัดมีความหมาย → ใช้ "Spacebar" เท่านั้น ห้ามใช้ Tab
#   4) อยากเพิ่มรายการ (ผลงาน / ประสบการณ์ / ทักษะ) → copy ทั้งก้อนที่ขึ้นต้นด้วย  -
#      แล้ววางต่อท้าย ให้ย่อหน้าตรงกับก้อนเดิม
#   5) ถ้าข้อความมี  :  หรือ  #  อยู่ข้างใน ให้ครอบด้วย "เครื่องหมายคำพูด"
#
#  ช่องไหนไม่อยากแสดง → ใส่ ""  ส่วนนั้นจะถูกซ่อนให้อัตโนมัติ
#  รูปภาพ → อัปโหลดไว้ในโฟลเดอร์ images/ แล้วใส่ชื่อ เช่น  images/me.jpg
# ═══════════════════════════════════════════════════════════════════


# ─────────────────────────────────────────────
# 👤 ข้อมูลส่วนตัว — แก้ตรงนี้ที่เดียว ใช้ทั้งเว็บ
#    (ข้อความหลัง # บอกว่าช่องนั้นไปโผล่ตรงไหนบนเว็บ)
# ─────────────────────────────────────────────
profile:
  name: Chatrphol                     # ชื่อตัวใหญ่หน้าแรก + โลโก้มุมซ้ายบน + ชื่อแท็บเบราว์เซอร์
  greeting: Hi there 👋 I'm           # บรรทัดเล็กเหนือชื่อ
  role_prefix: "I'm a"                # คำหน้าตำแหน่งที่พิมพ์สลับ เช่น  I'm a [Creative Designer]
  roles:                              # ตำแหน่ง/สิ่งที่ทำ → พิมพ์สลับกัน + แถบตัวอักษรใหญ่ (ใส่กี่อันก็ได้)
    - Creative Designer
    - Content Creator
    - Problem Solver
  intro: I turn ideas into things people can see and use — from visual design and video to websites. I believe good work should look great and actually work.   # ย่อหน้าแนะนำตัวหน้าแรก
  photo: ""                           # รูปโปรไฟล์ในวงกลม เช่น images/me.jpg (เว้นว่าง = ใช้ตัวอักษรแรกของชื่อ)
  location: Bangkok, Thailand         # โชว์ในส่วน About
  email: hello@example.com            # ปุ่มส่งอีเมล + ส่วน Contact + About (เว้นว่าง = ซ่อนปุ่มอีเมล)
  resume: ""                          # ลิงก์ Resume/CV เช่น images/resume.pdf (เว้นว่าง = ไม่มีปุ่มดาวน์โหลด)
  available: true                     # true = โชว์ป้ายสีเขียว  /  false = ซ่อนป้าย
  available_text: Available for new projects   # ข้อความบนป้ายสีเขียว


