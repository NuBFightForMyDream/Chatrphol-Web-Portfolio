    You can call me "Nine (นายน์)" as well , I'm passionate in learning new skills. My life is always being in hard mode and that's why I have to fight for my dream.

    I'm interested in Tech Consultant roles which need tech skills to apply on real-world problems. My intrested topics are Data Science & Machine Learning , AI and Quantum Computing.
    
    My outside-tech interests are Drama Arts , Food Sciences and Cooking Reality Show. 


